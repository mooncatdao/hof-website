name: Sync public HOF site to DAO website

on:
  push:
    branches:
      - main
    paths:
      - "public/index.html"
      - "public/styles/site.css"
      - "public/assets/**"
      - "public/display-options.js"
      - "public/libmooncat-limited.js"
      - "public/vendor/starfield.js"
      - "public/vendor/starfield.LICENSE.txt"
      - "public/members.json"
      - "public/overrides.json"
      - ".github/workflows/sync-public-hof-to-dao-site.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-hof:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hof-website source repo
        uses: actions/checkout@v4
        with:
          path: hof-website

      # Requires a repo secret named DAO_WEBSITE_SYNC_TOKEN with permission to
      # push branches and open pull requests in mooncatdao/mooncatdao-website.
      - name: Checkout mooncatdao-website target repo
        uses: actions/checkout@v4
        with:
          repository: mooncatdao/mooncatdao-website
          token: ${{ secrets.DAO_WEBSITE_SYNC_TOKEN }}
          path: mooncatdao-website

      # The public HOF viewer is mirrored into mooncatdao-website/public/hof so
      # it can be served from the /hof/ subdirectory on the DAO website.
      - name: Prepare target HOF directory
        run: |
          rm -rf mooncatdao-website/public/hof
          mkdir -p mooncatdao-website/public/hof

      # Copy a conservative whitelist of files used by public/index.html.
      # Admin, auth, API, Cloudflare Functions and editor files are intentionally
      # excluded because the DAO website only hosts the public static viewer.
      - name: Copy selected public files
        run: |
          set -euo pipefail

          mkdir -p mooncatdao-website/public/hof/styles
          mkdir -p mooncatdao-website/public/hof/vendor

          cp hof-website/public/index.html mooncatdao-website/public/hof/index.html
          cp hof-website/public/display-options.js mooncatdao-website/public/hof/display-options.js
          cp hof-website/public/libmooncat-limited.js mooncatdao-website/public/hof/libmooncat-limited.js
          cp hof-website/public/members.json mooncatdao-website/public/hof/members.json
          cp hof-website/public/overrides.json mooncatdao-website/public/hof/overrides.json
          cp hof-website/public/styles/site.css mooncatdao-website/public/hof/styles/site.css
          cp hof-website/public/vendor/starfield.js mooncatdao-website/public/hof/vendor/starfield.js
          cp hof-website/public/vendor/starfield.LICENSE.txt mooncatdao-website/public/hof/vendor/starfield.LICENSE.txt

          cp -R hof-website/public/assets mooncatdao-website/public/hof/assets

      - name: Create pull request in DAO website repo
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.DAO_WEBSITE_SYNC_TOKEN }}
          path: mooncatdao-website
          branch: sync/hof-public-site
          delete-branch: true
          title: "Sync public HOF site"
          commit-message: "Sync public HOF site from hof-website"
          body: |
            Automated sync of the public Hall of Fame static site from mooncatdao/hof-website.

            This sync intentionally includes only public-facing files and excludes admin/auth/API functionality.
          labels: automated-sync
