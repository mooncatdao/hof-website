name: Sync public HOF site to DAO website

on:
  push:
    branches:
      - main
    paths:
      - "public/index.html"
      - "public/styles/site.css"
      - "public/assets/**"
      - "public/scripts/display-options.js"
      - "public/scripts/libmooncat-limited.js"
      - "public/scripts/site.js"
      - "public/vendor/starfield.js"
      - "public/vendor/starfield.LICENSE.txt"
      - "public/vendor/html2canvas.min.js"
      - "public/vendor/html2canvas.LICENSE.txt"
      - "public/members.json"
      - "public/overrides.json"
      - ".github/workflows/sync-public-hof-to-dao-site.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-hof:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout hof-website source repo
        uses: actions/checkout@v4
        with:
          path: hof-website

      # Requires a repo secret named DAO_WEBSITE_SYNC_TOKEN with permission to
      # push directly to mooncatdao/mooncatdao-website.
      - name: Checkout mooncatdao-website target repo
        uses: actions/checkout@v4
        with:
          repository: mooncatdao/mooncatdao-website
          token: ${{ secrets.DAO_WEBSITE_SYNC_TOKEN }}
          path: mooncatdao-website

      # The public HOF viewer is mirrored into mooncatdao-website/hof so
      # it can be served from the /hof/ subdirectory on the DAO website.
      - name: Prepare target HOF directory
        run: |
          rm -rf mooncatdao-website/hof
          mkdir -p mooncatdao-website/hof

      # Copy a conservative whitelist of files used by public/index.html.
      # Admin, auth, API, Cloudflare Functions and editor files are intentionally
      # excluded because the DAO website only hosts the public static viewer.
      - name: Copy selected public files
        run: |
          set -euo pipefail

          mkdir -p mooncatdao-website/hof/styles
          mkdir -p mooncatdao-website/hof/scripts
          mkdir -p mooncatdao-website/hof/vendor

          cp hof-website/public/index.html mooncatdao-website/hof/index.html
          cp hof-website/public/scripts/display-options.js mooncatdao-website/hof/scripts/display-options.js
          cp hof-website/public/scripts/libmooncat-limited.js mooncatdao-website/hof/scripts/libmooncat-limited.js
          cp hof-website/public/scripts/site.js mooncatdao-website/hof/scripts/site.js
          cp hof-website/public/members.json mooncatdao-website/hof/members.json
          cp hof-website/public/overrides.json mooncatdao-website/hof/overrides.json
          cp hof-website/public/styles/site.css mooncatdao-website/hof/styles/site.css
          cp hof-website/public/vendor/starfield.js mooncatdao-website/hof/vendor/starfield.js
          cp hof-website/public/vendor/starfield.LICENSE.txt mooncatdao-website/hof/vendor/starfield.LICENSE.txt
          cp hof-website/public/vendor/html2canvas.min.js mooncatdao-website/hof/vendor/html2canvas.min.js
          cp hof-website/public/vendor/html2canvas.LICENSE.txt mooncatdao-website/hof/vendor/html2canvas.LICENSE.txt

          cp -R hof-website/public/assets mooncatdao-website/hof/assets

      - name: Commit and push directly to DAO website repo
        run: |
          set -euo pipefail

          cd mooncatdao-website

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- hof; then
            echo "No HOF changes to sync."
            exit 0
          fi

          git add hof
          git commit -m "Sync public HOF site from hof-website"
          git push origin HEAD:main
