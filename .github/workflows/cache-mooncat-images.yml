name: Cache MoonCat Images

on:
  push:
    branches:
      - main
    paths:
      - 'public/overrides.json'
      - 'scripts/cache-mooncat-images.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cache-mooncat-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache-mooncat-images
  cancel-in-progress: true

jobs:
  cache-mooncat-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache MoonCat Images
        run: npm run cache:images

      - name: Commit Updated Image Cache
        run: |
          if git diff --quiet -- public/assets/mooncats; then
            echo "No changes to public/assets/mooncats"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/mooncats
          git commit -m "chore: update MoonCat image cache"
          git push
