<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Day 1 MoonCat Club</title>
    <link href="https://fonts.cdnfonts.com/css/setback" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/site.css" />
    <link rel="preload" href="./libmooncat-limited.js" as="script" />
    <link rel="preload" href="./vendor/starfield.js" as="script" />
    <script src="./libmooncat-limited.js"></script>
    <script src="./vendor/starfield.js"></script>
  </head>
  <body>
    <div id="starfieldLayer" class="starfieldLayer" aria-hidden="true"></div>
    <div id="starfieldOrigin" class="starfield-origin starfieldOrigin" aria-hidden="true"></div>
    <main class="page">
      <header class="masthead">
        <div class="titleBlock">
          <h1 class="title">Day 1 MoonCat Club</h1>
          <div class="subtitle">Hall of Fame</div>
        </div>
        <div class="displayControls">
          <label class="themePicker">
            <select id="themeSelect" aria-label="Select Hall of Fame theme">
              <option value="og">OG</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
              <option value="obsidian">Obsidian</option>
              <option value="deepspace">DeepSpace</option>
              <option value="onlycats">OnlyCats</option>
            </select>
          </label>
          <button id="flyingToggle" class="flyingToggle" type="button" aria-pressed="false">
            Flying Off
          </button>
        </div>
      </header>
      <div id="app" class="loading">Loading members...</div>
    </main>

    <script>
      function titleCase(value) {
        return value
          .split(/[\s_-]+/)
          .filter(Boolean)
          .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
          .join(' ')
      }

      function stripEth(value) {
        return typeof value === 'string' ? value.replace(/\.eth$/i, '') : ''
      }

      function normalizeTwitter(value) {
        if (typeof value !== 'string' || value.length === 0) return null
        return value.startsWith('@') ? value : '@' + value
      }

      function getCatId(rescueIndex) {
        return LibMoonCat.getCatId(rescueIndex)
      }

      function getDisplayName(member) {
        if (typeof member.name === 'string' && member.name.trim().length > 0) {
          return member.name.trim()
        }

        const root = stripEth(member.ensName)
        return titleCase(root)
      }

      function getHandle(member) {
        if (typeof member.handle === 'string') return member.handle.trim()

        const twitter = normalizeTwitter(member.twitter)
        if (twitter !== null) return twitter
        return typeof member.ensName === 'string' ? '(' + member.ensName + ')' : ''
      }

      function getGeneratedCatImage(member) {
        return LibMoonCat.generateImage(member.catId || getCatId(member.rescueIndex))
      }

      function getCachedCatImage(member) {
        return './assets/mooncats/regular/' + member.rescueIndex + '.png'
      }

      function getPoseByRescueIndex(manifest) {
        const poseByRescueIndex = new Map()

        if (!Array.isArray(manifest?.files)) return poseByRescueIndex

        manifest.files.forEach((file) => {
          if (Number.isInteger(file.rescueIndex) && typeof file.pose === 'string') {
            poseByRescueIndex.set(file.rescueIndex, file.pose)
          }
        })

        return poseByRescueIndex
      }

      function applyTheme(theme) {
        const allowedThemes = new Set(['og', 'light', 'dark', 'obsidian', 'deepspace', 'onlycats'])
        const nextTheme = allowedThemes.has(theme) ? theme : 'og'

        document.body.dataset.theme = nextTheme

        try {
          localStorage.setItem('hof-theme', nextTheme)
        } catch (error) {
          // Theme switching still works when storage is unavailable.
        }
      }

      function initThemePicker() {
        const themeSelect = document.getElementById('themeSelect')
        let savedTheme = 'og'

        try {
          savedTheme = localStorage.getItem('hof-theme') || savedTheme
        } catch (error) {
          // Keep the default theme when storage is unavailable.
        }

        applyTheme(savedTheme)
        themeSelect.value = document.body.dataset.theme
        themeSelect.addEventListener('change', () => applyTheme(themeSelect.value))
      }

      let isStarfieldActive = false

      function startStarfield() {
        if (isStarfieldActive || typeof Starfield === 'undefined') return

        const layer = document.getElementById('starfieldLayer')
        const origin = document.getElementById('starfieldOrigin')

        Starfield.cleanup()
        Starfield.setup({
          auto: true,
          baseSpeed: 3,
          canvasColor: 'rgb(0, 0, 0)',
          container: layer,
          hueJitter: 360,
          maxAcceleration: 2,
          originElement: origin,
          accelerationRate: 0.05,
          decelerationRate: 0.05,
          minSpawnRadius: 80,
          maxSpawnRadius: 500,
          starColor: 'rgb(121, 239, 118)',
          trailLength: 0.8
        })
        layer.style.position = 'fixed'
        layer.style.inset = '0'
        Starfield.setAccelerate(false)
        isStarfieldActive = true
      }

      function stopStarfield() {
        if (!isStarfieldActive || typeof Starfield === 'undefined') return

        Starfield.setAccelerate(false)
        Starfield.cleanup()
        isStarfieldActive = false
      }

      function applyFlying(isFlying) {
        const flyingToggle = document.getElementById('flyingToggle')
        const nextValue = isFlying ? 'on' : 'off'

        document.body.dataset.flying = nextValue
        flyingToggle.setAttribute('aria-pressed', String(isFlying))
        flyingToggle.textContent = isFlying ? 'Flying On' : 'Flying Off'
        if (isFlying) startStarfield()
        else stopStarfield()

        try {
          localStorage.setItem('hof-flying', nextValue)
        } catch (error) {
          // Flying still toggles when storage is unavailable.
        }
      }

      function initFlyingToggle() {
        const flyingToggle = document.getElementById('flyingToggle')
        let savedFlying = 'off'

        try {
          savedFlying = localStorage.getItem('hof-flying') || savedFlying
        } catch (error) {
          // Keep flying off when storage is unavailable.
        }

        applyFlying(savedFlying === 'on')
        flyingToggle.addEventListener('click', () => {
          applyFlying(document.body.dataset.flying !== 'on')
        })
      }

      function applyOverrides(members, overrides, imageManifest) {
        const generatedByRescueIndex = new Map(
          members.map((member) => [member.rescueIndex, member]),
        )
        const poseByRescueIndex = getPoseByRescueIndex(imageManifest)
        const overrideMembers = Array.isArray(overrides?.members)
          ? overrides.members
          : []

        if (overrideMembers.length === 0) {
          return [...members].sort((a, b) => a.rescueIndex - b.rescueIndex)
        }

        return overrideMembers
          .map((override, index) => {
            const rescueIndex = Number(override.rescueIndex)
            const generated = generatedByRescueIndex.get(rescueIndex) || {}

            return {
              ...generated,
              ...override,
              rescueIndex,
              sortOrder: index,
              catId: override.catId || generated.catId || getCatId(rescueIndex),
              pose: poseByRescueIndex.get(rescueIndex),
            }
          })
          .filter((member) => Number.isInteger(member.rescueIndex))
          .sort((a, b) => a.sortOrder - b.sortOrder)
      }

      async function loadJson(path, required = true) {
        const response = await fetch(path)

        if (!response.ok) {
          if (!required) return null
          throw new Error('Failed to load ' + path)
        }

        return response.json()
      }

      function renderMember(member) {
        const card = document.createElement('article')
        card.className = 'member-card'
        if (typeof member.pose === 'string') card.dataset.pose = member.pose

        const top = document.createElement('div')
        top.className = 'member-top'

        const name = document.createElement('div')
        name.className = 'member-name'
        name.textContent = getDisplayName(member)

        const handle = document.createElement('div')
        handle.className = 'member-handle'
        handle.textContent = getHandle(member)

        top.appendChild(name)
        top.appendChild(handle)

        const imageFrame = document.createElement('div')
        imageFrame.className = 'member-imageFrame'

        const img = document.createElement('img')
        img.className = 'member-image'
        img.alt = 'MoonCat #' + member.rescueIndex
        img.src = getCachedCatImage(member)
        img.onerror = () => {
          img.onerror = null
          img.src = getGeneratedCatImage(member)
        }
        imageFrame.appendChild(img)

        const bottom = document.createElement('div')
        bottom.className = 'member-bottom'

        const cat = document.createElement('div')
        cat.className = 'member-cat'
        cat.textContent = 'MoonCat #' + member.rescueIndex
        bottom.appendChild(cat)

        if (typeof member.catName === 'string' && member.catName.trim().length > 0) {
          const catName = document.createElement('div')
          catName.className = 'member-catName'
          catName.textContent = member.catName.trim()
          bottom.appendChild(catName)
        }

        if (
          typeof member.favourite === 'number' &&
          member.favourite !== member.rescueIndex
        ) {
          const fav = document.createElement('div')
          fav.className = 'member-fav'
          fav.textContent = 'Fav #' + member.favourite
          bottom.appendChild(fav)
        }

        card.appendChild(top)
        card.appendChild(imageFrame)
        card.appendChild(bottom)

        return card
      }

      async function start() {
        const app = document.getElementById('app')

        try {
          const [generatedMembers, overrides, imageManifest] = await Promise.all([
            loadJson('./members.json'),
            loadJson('./overrides.json', false),
            loadJson('./assets/mooncats/manifest.json', false),
          ])
          const members = applyOverrides(generatedMembers, overrides, imageManifest)

          const grid = document.createElement('section')
          grid.className = 'grid'

          members.forEach((member) => {
            grid.appendChild(renderMember(member))
          })

          app.className = 'grid'
          app.textContent = ''
          app.replaceWith(grid)
        } catch (error) {
          console.error(error)
          app.className = 'error'
          app.textContent = 'Could not load Day 1 members.'
        }
      }

      window.addEventListener('DOMContentLoaded', () => {
        initThemePicker()
        initFlyingToggle()
        start()
      })
    </script>
  </body>
</html>
